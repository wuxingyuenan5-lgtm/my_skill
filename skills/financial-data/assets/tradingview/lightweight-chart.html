<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Data - Lightweight Charts</title><script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script><style>html,body,#chart{width:100%;height:100%;margin:0}</style></head><body><div id="chart"></div><script>const chart=LightweightCharts.createChart(document.getElementById('chart'),{autoSize:true,timeScale:{timeVisible:true,secondsVisible:false}});const series=chart.addSeries(LightweightCharts.CandlestickSeries);fetch('/api/bars?symbol=600519.SH&resolution=1D').then(r=>r.json()).then(rows=>{series.setData(rows);chart.timeScale().fitContent();});</script></body></html>
